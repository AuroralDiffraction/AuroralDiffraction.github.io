{{- define "main" }}
{{- partial "page-header.html" . }}
<div class="wrap">
  {{- with .Content }}<div class="prose list-intro">{{ . }}</div>{{ end }}
  {{- with .RegularPages }}
  <div class="project-grid">
    {{- range .ByWeight }}{{ partial "project-card.html" . }}{{ end }}
  </div>
  {{- else }}
  <p class="empty">Projects are on their way. Add one with <code>hugo new projects/my-project.md</code>.</p>
  {{- end }}
</div>
{{- end }}
