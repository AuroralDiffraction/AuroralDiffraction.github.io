baseURL: "https://auroraldiffraction.github.io/"
title: Auroral Diffraction

# Two languages: English at the site root (/blog/...), Simplified Chinese under /zh/ (/zh/blog/...).
# A post's translation is the same file name with .zh before .md (see ADDING-POSTS.md).
# Texts that differ per language (description, home page, date formats) are under each language;
# the theme's own words (buttons, labels) are in themes/auroral/i18n/.
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
hasCJKLanguage: true # count Chinese characters correctly for summaries and reading time
languages:
  en:
    languageCode: en-US
    languageName: English
    weight: 1
    params:
      langLabel: EN   # short label on the language switch and on untranslated posts
      description: "Auroral Diffraction writes about analog circuits, chip design and hardware."
      dateFormat: "2 January 2006"
      dateFormatMedium: "2 Jan 2006"
      dateFormatShort: "2 Jan"
      hero:
        title: "Auroral Diffraction"
        subtitle: "Analog circuit design"
        intro: "Notes on analog and mixed-signal circuits, chip design and the hardware around them."
        image: "/images/profile/profilePic.jpg"
        buttons:
          - name: Read the blog
            url: /blog/
          - name: See projects
            url: /projects/
  zh:
    languageCode: zh-CN
    languageName: 简体中文
    weight: 2
    params:
      langLabel: 中
      description: "Auroral Diffraction 撰写关于模拟电路、芯片设计与硬件的文章。"
      dateFormat: "2006年1月2日"
      dateFormatMedium: "2006年1月2日"
      dateFormatShort: "1月2日"
      hero:
        title: "Auroral Diffraction"
        subtitle: "模拟电路设计"
        intro: "关于模拟与混合信号电路、芯片设计及相关硬件的笔记。"
        image: "/images/profile/profilePic.jpg"
        buttons:
          - name: 阅读博客
            url: /blog/
          - name: 查看项目
            url: /projects/

# Custom theme living in themes/auroral.
# The earlier PaperMod version of the site is in the git history (commit 42c67e0).
theme: "auroral"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableGitInfo: false

# Keep processed images in Hugo's cache dir (cached between GitHub Actions runs).
caches:
  images:
    dir: :cacheDir/images

minify:
  disableXML: true
  minifyOutput: true

outputs:
  home: [HTML, RSS, JSON] # JSON powers the search page

taxonomies:
  tag: tags

# Only Markdown files in content/ become pages. Any .html file there is published unchanged,
# which is how interactive posts work: content/interactive/<name>/page.html is shown in a frame.
contentTypes:
  text/markdown: {}

# One menu for both languages. Names are translated in themes/auroral/i18n/ by identifier
# (menu.blog, menu.about, ...); links go to the page in the reader's language when it exists.
menu:
  main:
    - identifier: blog
      name: Blog
      url: /blog/
      weight: 10
    - identifier: interactive
      name: Interactive
      url: /interactive/
      weight: 15
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 20
    - identifier: about
      name: About
      url: /about/
      weight: 30

params:
  author: "AuroralDiffraction"
  defaultTheme: dark   # dark | light | auto (follows the visitor's system)
  images: ["/images/profile/profilePic.jpg"] # default social-preview image

  # Animated aurora + circuit background. Set to false to turn it off site-wide.
  background: true

  # Load KaTeX on every post. Leave false and set `math: true` in a post's front matter instead.
  math: false

  # The home page text (hero) and description are set per language under `languages:` above.

  # How many items the home page shows.
  homeRecentPosts: 5
  homeFeaturedProjects: 4

  social:
    - name: github
      url: "https://github.com/AuroralDiffraction"
    - name: twitter
      url: "https://twitter.com/Tanatonium"
    # - name: linkedin
    #   url: "https://www.linkedin.com/in/<you>/"
    # - name: email
    #   url: "mailto:you@example.com"
    - name: rss
      url: "/index.xml"

  favicon:
    ico: "/favicon/favicon.ico"
    png16: "/favicon/favicon-16x16.png"
    png32: "/favicon/favicon-32x32.png"
    appleTouch: "/favicon/apple-touch-icon.png"
    manifest: "/favicon/site.webmanifest"

markup:
  goldmark:
    renderer:
      unsafe: true # allow raw HTML inside Markdown
    parser:
      wrapStandAloneImageWithinParagraph: false # images on their own line become proper <figure>s
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [["\\[", "\\]"], ["$$", "$$"]]
          inline: [["\\(", "\\)"], ["$", "$"]]
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: false
    lineNos: false
  tableOfContents:
    startLevel: 2
    endLevel: 3
